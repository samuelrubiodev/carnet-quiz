{% extends "base.html" %}{% block content %}<h1>Crear test</h1><form method="post" action="/tests"><label>Modo <select name="mode"><option value="random">Aleatorio</option><option value="balanced">Equilibrado</option><option value="new">Nuevas</option><option value="wrong_review">Repaso de fallos</option><option value="smart">Repaso inteligente</option><option value="exam">Examen</option></select></label><label>Preguntas <input type="number" name="count" min="1" max="100" value="10"></label><fieldset><legend>Vídeos</legend>{% for video in videos %}<label><input type="checkbox" name="video_ids" value="{{ video.id }}">{{ video.title }}</label>{% endfor %}</fieldset><button>Empezar</button></form>{% endblock %}

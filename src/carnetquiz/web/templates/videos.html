{% extends "base.html" %}{% block content %}<h1>Vídeos</h1><form method="post"><label>URL YouTube <input name="url" required></label><button>Añadir vídeo</button></form><table><tr><th>Título</th><th>Duración</th><th>Estado</th><th></th></tr>{% for video in videos %}<tr><td>{{ video.title }}</td><td>{{ video.duration_seconds or "?" }} s</td><td>{{ video.status }}</td><td><a href="/videos/{{ video.id }}/transcript">Transcripción</a></td></tr>{% else %}<tr><td colspan="4">No hay vídeos.</td></tr>{% endfor %}</table>{% endblock %}

<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>{% block title %}CarnetQuiz{% endblock %} · CarnetQuiz</title>
    <script>
        (() => {
            try {
                const theme = localStorage.getItem("cq-theme");
                if (theme === "light" || theme === "dark") {
                    document.documentElement.dataset.theme = theme;
                }
            } catch (_) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>
<body data-page="{{ request.url.path }}">
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/" aria-label="CarnetQuiz, inicio">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" focusable="false"><path fill="currentColor" d="M5 5h5v3H8v8h2v3H5V5Zm9 0h5v14h-5v-3h2V8h-2V5Z"/></svg>
                </span>
                <span>CarnetQuiz</span>
            </a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
                <span class="sr-only">Abrir navegación</span>
                <span class="nav-toggle-lines" aria-hidden="true"></span>
            </button>
            <nav id="main-nav" class="main-nav" aria-label="Navegación principal">
                <a class="nav-link {% if request.url.path == '/' %}is-active{% endif %}" href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>
                    Inicio
                </a>
                <a class="nav-link {% if request.url.path.startswith('/videos') %}is-active{% endif %}" href="/videos" {% if request.url.path.startswith('/videos') %}aria-current="page"{% endif %}>
                    Vídeos
                </a>
                <a class="nav-link {% if request.url.path.startswith('/jobs') %}is-active{% endif %}" href="/jobs" {% if request.url.path.startswith('/jobs') %}aria-current="page"{% endif %}>
                    Trabajos
                </a>
                <a class="nav-link {% if request.url.path.startswith('/tests') or request.url.path.startswith('/results') %}is-active{% endif %}" href="/tests/new" {% if request.url.path.startswith('/tests') or request.url.path.startswith('/results') %}aria-current="page"{% endif %}>
                    Crear test
                </a>
                <a class="nav-link {% if request.url.path.startswith('/statistics') %}is-active{% endif %}" href="/statistics" {% if request.url.path.startswith('/statistics') %}aria-current="page"{% endif %}>
                    Estadísticas
                </a>
                <a class="nav-link nav-link-data {% if request.url.path.startswith('/admin/data') %}is-active{% endif %}" href="/admin/data" {% if request.url.path.startswith('/admin/data') %}aria-current="page"{% endif %}>
                    <span class="wide-label">Administración de datos</span>
                    <span class="short-label" aria-hidden="true">Datos</span>
                </a>
            </nav>
            <div class="header-tools">
                <label class="tool-control" for="theme-select">
                    <span class="sr-only">Tema de color</span>
                    <select id="theme-select" aria-label="Tema de color">
                        <option value="system">Sistema</option>
                        <option value="light">Claro</option>
                        <option value="dark">Oscuro</option>
                    </select>
                </label>
                <button class="sound-control" type="button" id="sound-toggle" aria-pressed="false" title="Activar sonidos">
                    <span class="sound-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" focusable="false"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2-3.75v7.5A4.5 4.5 0 0 0 16.5 12Zm0-8.4v2.1A7.5 7.5 0 0 1 16.5 18.3v2.1A9.5 9.5 0 0 0 16.5 3.6Z"/></svg></span>
                    <span class="sound-label">Sonido apagado</span>
                </button>
            </div>
        </div>
    </header>
    <main id="main-content" class="main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">CarnetQuiz · estudio claro, progreso constante</footer>
</body>
</html>

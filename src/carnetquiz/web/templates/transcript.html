{% extends "base.html" %}{% block content %}<h1>{{ video.title }}</h1><form><input name="search" placeholder="Buscar texto"><button>Buscar</button></form><ol>{% for segment in segments %}<li id="s{{ segment.id }}"><a href="{{ video.url }}&t={{ segment.start_seconds|int }}s" target="_blank">{{ "%.1f"|format(segment.start_seconds) }}–{{ "%.1f"|format(segment.end_seconds) }}</a> {{ segment.text }}</li>{% else %}<li>Sin segmentos.</li>{% endfor %}</ol>{% endblock %}

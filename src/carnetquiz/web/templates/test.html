{% extends "base.html" %}{% block content %}<p>Pregunta {{ position }} de {{ total }}</p><progress value="{{ position-1 }}" max="{{ total }}"></progress><h1>{{ question.question }}</h1><form method="post">{% for option in question.options %}<label class="option"><input type="radio" name="option" value="{{ option.id }}" required> {{ option.text }}</label>{% endfor %}<button>Responder</button></form>{% endblock %}
